<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>QueryCrafter Chat</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#f5f7fb;
    font-family:Inter,Arial,sans-serif;
    color:#333;
}

.container{
    width:95%;
    max-width:1200px;
    margin:30px auto;
}

h1{
    color:#2563eb;
    margin-bottom:5px;
}

.subtitle{
    color:#666;
    margin-bottom:25px;
}

.card{
    background:white;
    border-radius:10px;
    padding:20px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:600;
}

textarea,
input{

    width:100%;
    border:1px solid #ddd;
    border-radius:6px;
    padding:10px;
    margin-bottom:15px;
    font-size:15px;
}

textarea{

    resize:vertical;
}

#schema{

    height:180px;
    font-family:monospace;
}

#question{

    height:90px;
}

button{

    background:#2563eb;
    color:white;
    border:none;
    border-radius:6px;
    padding:12px 22px;
    cursor:pointer;
    font-size:15px;
}

button:hover{

    background:#1d4ed8;
}

button:disabled{

    background:#999;
    cursor:not-allowed;
}

.status{

    margin-top:10px;
    font-weight:bold;
}

.success{

    color:green;
}

.error{

    color:red;
}

.chat-box{

    height:550px;
    overflow-y:auto;
    border:1px solid #ddd;
    border-radius:8px;
    background:white;
    padding:20px;
}

.message{

    margin-bottom:25px;
}

.user{

    text-align:right;
}

.user .bubble{

    display:inline-block;
    background:#2563eb;
    color:white;
    padding:12px;
    border-radius:10px;
    max-width:70%;
}

.assistant{

    text-align:left;
}

.sql{

    background:#111827;
    color:#e5e7eb;
    padding:15px;
    border-radius:8px;
    margin-top:10px;
    white-space:pre-wrap;
    font-family:Consolas,monospace;
}

.reasoning{

    margin-top:10px;
    color:#666;
    font-style:italic;
}

.controls{

    display:flex;
    gap:15px;
    margin-top:20px;
}

.hidden{

    display:none;
}

.loading{

    color:#2563eb;
    font-style:italic;
}

</style>

</head>

<body>

<div class="container">

<h1>🛠 QueryCrafter</h1>

<div class="subtitle">
Conversational SQL Assistant powered by Ollama
</div>

<div class="card">

<label>
Database Schema (DDL)
</label>

<textarea
id="schema"
placeholder="Paste CREATE TABLE statements here..."
></textarea>

<label>
Domain
</label>

<input
id="domain"
type="text"
value="General"
>

<div class="controls">

<button
id="loadBtn"
onclick="loadSchema()">
Load Schema
</button>

<button
onclick="newSession()">
New Session
</button>

</div>

<div
id="schemaStatus"
class="status">
No schema loaded.
</div>

</div>

<div
id="chatCard"
class="card hidden">

<h2 style="margin-bottom:15px;">
Conversation
</h2>

<div
id="chatBox"
class="chat-box">

</div>

<div style="margin-top:20px;">

<textarea
id="question"
placeholder="Ask your SQL question..."
></textarea>

<div class="controls">

<button
id="sendBtn"
onclick="sendQuestion()">
Send
</button>

<button
onclick="resetConversation()">
Reset Conversation
</button>

</div>

</div>

</div>
<script>

let sessionId = null;

// ------------------------------------------------------------
// Load Schema
// ------------------------------------------------------------

async function loadSchema() {

    const schema = document.getElementById("schema").value.trim();
    const domain = document.getElementById("domain").value.trim();

    if (!schema) {
        alert("Please enter a database schema.");
        return;
    }

    const btn = document.getElementById("loadBtn");
    btn.disabled = true;
    btn.innerText = "Loading...";

    try {

        const response = await fetch("/schema", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                schema,
                domain
            })

        });

        const data = await response.json();

        if (!data.success) {

            alert(data.error);

            btn.disabled = false;
            btn.innerText = "Load Schema";

            return;
        }

        sessionId = data.session_id;

        document.getElementById("schema").disabled = true;
        document.getElementById("domain").disabled = true;

        document.getElementById("schemaStatus").innerHTML =
            "✅ Schema Loaded";

        document.getElementById("schemaStatus").className =
            "status success";

        document
            .getElementById("chatCard")
            .classList
            .remove("hidden");

        btn.innerText = "Loaded";

    }

    catch(err){

        alert(err.message);

        btn.disabled = false;
        btn.innerText = "Load Schema";
    }

}

// ------------------------------------------------------------
// Send Question
// ------------------------------------------------------------

async function sendQuestion(){

    if(sessionId==null){

        alert("Load schema first.");

        return;
    }

    const textarea=document.getElementById("question");

    const question=textarea.value.trim();

    if(question=="")
        return;

    appendUser(question);

    textarea.value="";

    const loading=document.createElement("div");
    loading.className="loading";
    loading.id="loading";
    loading.innerHTML="Thinking...";

    document
        .getElementById("chatBox")
        .appendChild(loading);

    scrollBottom();

    document.getElementById("sendBtn").disabled=true;

    try{

        const response=await fetch("/chat",{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify({

                session_id:sessionId,

                question:question

            })

        });

        const data=await response.json();

        document
            .getElementById("loading")
            .remove();

        if(data.success){

            appendAssistant(

                data.assistant.sql_query,

                data.assistant.reasoning,

                data.attempts_used

            );

        }

        else{

            appendAssistant(

                "ERROR",

                data.error,

                0

            );

        }

    }

    catch(err){

        document
            .getElementById("loading")
            .remove();

        appendAssistant(

            "Network Error",

            err.message,

            0

        );

    }

    document.getElementById("sendBtn").disabled=false;

}

// ------------------------------------------------------------
// User Bubble
// ------------------------------------------------------------

function appendUser(message){

    const div=document.createElement("div");

    div.className="message user";

    div.innerHTML=`

        <div class="bubble">

        ${escapeHtml(message)}

        </div>

    `;

    document
        .getElementById("chatBox")
        .appendChild(div);

    scrollBottom();

}

// ------------------------------------------------------------
// Assistant Bubble
// ------------------------------------------------------------

function appendAssistant(sql,reasoning,attempts){

    const div=document.createElement("div");

    div.className="message assistant";

    div.innerHTML=`

        <div>

            <strong>Generated SQL</strong>

            <div class="sql">

${escapeHtml(sql)}

            </div>

            <div class="reasoning">

💡 ${escapeHtml(reasoning)}

            </div>

            <div
            style="font-size:12px;color:#999;margin-top:8px;">

Attempts: ${attempts}

            </div>

        </div>

    `;

    document
        .getElementById("chatBox")
        .appendChild(div);

    scrollBottom();

}

// ------------------------------------------------------------
// Reset Conversation
// ------------------------------------------------------------

async function resetConversation(){

    if(sessionId==null)
        return;

    await fetch("/reset/"+sessionId,{

        method:"POST"

    });

    document
        .getElementById("chatBox")
        .innerHTML="";

}

// ------------------------------------------------------------
// New Session
// ------------------------------------------------------------

function newSession(){

    sessionId=null;

    document.getElementById("schema").disabled=false;

    document.getElementById("domain").disabled=false;

    document.getElementById("schema").value="";

    document.getElementById("domain").value="General";

    document.getElementById("chatBox").innerHTML="";

    document
        .getElementById("chatCard")
        .classList
        .add("hidden");

    document.getElementById("schemaStatus").innerHTML=
        "No schema loaded.";

    document.getElementById("schemaStatus").className=
        "status";

    const btn=document.getElementById("loadBtn");

    btn.disabled=false;

    btn.innerText="Load Schema";

}

// ------------------------------------------------------------
// Helpers
// ------------------------------------------------------------

function scrollBottom(){

    const box=document.getElementById("chatBox");

    box.scrollTop=box.scrollHeight;

}

function escapeHtml(text){

    return text
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;");

}

document
    .getElementById("question")
    .addEventListener("keypress",function(e){

        if(e.key==="Enter" && !e.shiftKey){

            e.preventDefault();

            sendQuestion();

        }

});

</script>

</body>
</html>
