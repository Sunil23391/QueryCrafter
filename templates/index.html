<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QueryCrafter Chat</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
<div class="container">
    <h1>🛠 QueryCrafter</h1>
    <div class="subtitle">Conversational SQL Assistant powered by Ollama</div>

    <div id="mainLayout" class="layout">
        <div class="left-panel">
            <div class="card">
                <label>Database Schema (DDL)</label>
                <textarea id="schema" placeholder="Paste CREATE TABLE statements here..."></textarea>

                <label>Domain</label>
                <input id="domain" type="text" value="General">

                <div class="controls">
                    <button id="loadBtn" onclick="loadSchema()">Load Schema</button>
                    <button onclick="newSession()">New Session</button>
                </div>

                <div id="schemaStatus" class="status">No schema loaded.</div>
            </div>

            <div class="card">
                <h3>API Connection Configurations</h3>
                <div class="controls" style="margin-top:10px;">
                    <button type="button" onclick="showApiConfigForm()">New API Config</button>
                </div>

                <div id="apiConfigForm" class="api-form hidden">
                    <label>API Name</label>
                    <input id="apiName" type="text" placeholder="Example API">

                    <label>Endpoint URL</label>
                    <input id="apiEndpoint" type="text" placeholder="https://api.example.com/data">

                    <label>HTTP Method</label>
                    <select id="apiMethod">
                        <option value="GET">GET</option>
                        <option value="POST">POST</option>
                    </select>

                    <div id="headersSection">
                        <label>Headers (one per line: Key: Value)</label>
                        <textarea id="apiHeaders" placeholder="Authorization: Bearer TOKEN"></textarea>
                    </div>

                    <label class="checkbox-row">
                        <input id="authRequired" type="checkbox">
                        <span>Authentication Required</span>
                    </label>

                    <div id="authSection" class="auth-section hidden">
                        <label>Authentication Type</label>
                        <select id="apiAuthType">
                            <option value="none">None</option>
                            <option value="bearer">Bearer Token</option>
                            <option value="api_key">API Key</option>
                            <option value="basic">Basic Auth</option>
                        </select>

                        <div id="authFields"></div>
                    </div>

                    <label>Request Body Template</label>
                    <textarea id="apiBodyTemplate" placeholder="{"query":"{{query}}"}"></textarea>

                    <label>Response Format</label>
                    <select id="apiResponseFormat">
                        <option value="auto">Auto Detect</option>
                        <option value="json">JSON</option>
                        <option value="csv">CSV</option>
                    </select>

                    <div class="controls">
                        <button type="button" onclick="saveApiConfig()">Save Config</button>
                        <button type="button" onclick="validateApiConfig()">Validate</button>
                        <button type="button" onclick="cancelApiConfigForm()">Cancel</button>
                    </div>
                </div>

                <div id="apiConfigList" class="api-list"></div>

                <div id="apiPreview" class="preview-panel hidden"></div>

                <div id="apiImportStatus" class="status"></div>
            </div>
        </div>

        <div class="right-panel">
            <div id="chatCard" class="card">
                <h2 style="margin-bottom:15px;">Conversation</h2>

                <div id="chatBox" class="chat-box"></div>

                <div style="margin-top:20px;">
                    <textarea id="question" placeholder="Ask your SQL question..."></textarea>

                    <div class="controls">
                        <button id="sendBtn" onclick="sendQuestion()">Send</button>
                        <button onclick="resetConversation()">Reset Conversation</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
